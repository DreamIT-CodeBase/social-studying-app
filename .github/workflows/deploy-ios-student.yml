name: Deploy iOS apps

on:
  push:
    branches:
      - main
      - tarun/entra-auth
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload both signed IPAs to TestFlight
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-apps-testflight
  cancel-in-progress: false

jobs:
  build:
    name: Build and deploy ${{ matrix.flavor }} app
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: student
            bundle_id: ai.socialstudying.app
            target: lib/main_student.dart
            profile_secret: IOS_PROVISIONING_PROFILE_BASE64
          - flavor: admin
            bundle_id: ai.socialstudying.app.admin
            target: lib/main_admin.dart
            profile_secret: IOS_ADMIN_PROVISIONING_PROFILE_BASE64
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app
    env:
      APP_BUNDLE_ID: ${{ matrix.bundle_id }}
      APP_FLAVOR: ${{ matrix.flavor }}
      APP_TARGET: ${{ matrix.target }}
      APPLE_TEAM_ID: B7BJ5HC53B
    steps:
      - uses: actions/checkout@v4



      - name: Select Xcode 26 toolchain
        run: |
          if [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.1.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify App Store build toolchain
        run: |
          xcode_version=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          xcode_major=${xcode_version%%.*}
          if (( xcode_major < 26 )); then
            echo "Xcode 26 or later is required by App Store Connect; runner selected Xcode $xcode_version." >&2
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install Apple signing credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets[matrix.profile_secret] }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/distribution.p12"
          profile_path="$RUNNER_TEMP/$APP_FLAVOR.mobileprovision"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          profile_plist="$RUNNER_TEMP/$APP_FLAVOR-profile.plist"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")
          profile_app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")
          profile_aps_environment=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$profile_plist" 2>/dev/null || true)

          if [[ "$profile_app_id" != "$APPLE_TEAM_ID.$APP_BUNDLE_ID" ]]; then
            echo "Provisioning profile is for '$profile_app_id', expected '$APPLE_TEAM_ID.$APP_BUNDLE_ID'." >&2
            exit 1
          fi
          if [[ "$APP_FLAVOR" == "student" && "$profile_aps_environment" != "production" ]]; then
            echo "Provisioning profile '$profile_name' does not include production APNs. Enable Push Notifications for $APP_BUNDLE_ID and replace the profile secret." >&2
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      - name: Create App Store export configuration
        run: |
          plutil -create xml1 "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $IOS_PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Build signed IPA
        run: |
          signing_config="ios/Flutter/CI-signing.xcconfig"
          {
            printf 'CODE_SIGN_STYLE=Manual\n'
            printf 'CODE_SIGN_IDENTITY=Apple Distribution\n'
            printf 'DEVELOPMENT_TEAM=%s\n' "$APPLE_TEAM_ID"
            printf 'PROVISIONING_PROFILE_SPECIFIER=%s\n' "$IOS_PROFILE_NAME"
            if [[ "$APP_FLAVOR" == "student" ]]; then
              printf 'CODE_SIGN_ENTITLEMENTS=Runner/Runner.entitlements\n'
            fi
          } > "$signing_config"
          printf '\n#include "CI-signing.xcconfig"\n' >> "ios/Flutter/Release-$APP_FLAVOR.xcconfig"

          build_number=$((10000 + GITHUB_RUN_NUMBER))
          flutter build ipa \
            --release \
            --flavor "$APP_FLAVOR" \
            --target "$APP_TARGET" \
            --build-number "$build_number" \
            --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-studying-${{ matrix.flavor }}-ios-${{ github.run_number }}
          path: flutter_app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Configure App Store Connect API key
        if: github.event_name == 'push' || inputs.upload_to_testflight
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Upload to TestFlight
        if: github.event_name == 'push' || inputs.upload_to_testflight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ipa_path=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa_path"
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa_path" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
