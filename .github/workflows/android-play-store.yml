name: Deploy Android to Google Play Internal Testing

on:
  push:
    branches:
      - main
      - tarun/entra-auth
  workflow_dispatch:

concurrency:
  group: android-play-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: student
            target: lib/main_student.dart
            package_name: com.socialstudyapp.social_study_app
          - flavor: admin
            target: lib/main_admin.dart
            package_name: com.socialstudyapp.social_study_app.admin
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/play-upload-keystore.jks

      - name: Configure key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=play-upload-keystore.jks
          EOF

      - name: Build signed App Bundle (${{ matrix.flavor }})
        run: |
          build_number=$((10000 + GITHUB_RUN_NUMBER))
          flutter build appbundle \
            --release \
            --flavor ${{ matrix.flavor }} \
            --target ${{ matrix.target }} \
            --build-number "$build_number"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-bundle-${{ github.run_number }}
          path: flutter_app/build/app/outputs/bundle/${{ matrix.flavor }}Release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: ${{ matrix.package_name }}
          releaseFiles: flutter_app/build/app/outputs/bundle/${{ matrix.flavor }}Release/*.aab
          track: internal
          status: completed
