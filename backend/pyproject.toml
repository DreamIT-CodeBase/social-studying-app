[project]
name = "social-study-app-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "motor>=3.4",                        # async MongoDB driver for Cosmos DB MongoDB API
    "azure-storage-blob>=12.19",
    "azure-search-documents>=11.6",
    "azure-identity>=1.17",
    "openai>=1.35",                    # Azure OpenAI via AI Foundry
    "redis>=5.0",
    "azure-servicebus>=7.12",
    "azure-communication-email>=1.0",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",  # JWT validation for B2C tokens
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",                     # TestClient transport
    "ruff>=0.4",
    "mypy>=1.10",
    "msal>=1.30",                       # used by scripts/smoke_test_auth.py
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in default args is intentional

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
