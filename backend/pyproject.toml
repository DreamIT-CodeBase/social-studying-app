[project]
name = "social-study-app-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",            # [email] pulls email-validator, required by EmailStr in user/tenant models
    "aiohttp>=3.9",                    # hard import in azure.ai.contentsafety.aio + azure.search.documents.aio transport
    "pydantic-settings>=2.3",
    "motor>=3.4",                        # async MongoDB driver for Cosmos DB MongoDB API
    "azure-storage-blob>=12.19",
    "azure-search-documents>=12.0.0,<13.0.0",  # GA line uses VectorizedQuery(k_nearest_neighbors=); loose >=11.6 let the image drift to 12.x while dev held the 11.7.0bX beta (k= kwarg) -> 500s. Pin keeps both on GA.
    "azure-ai-documentintelligence>=1.0",  # PDF/OCR text extraction (prebuilt-read)
    "azure-ai-contentsafety>=1.0",       # Content moderation for uploads + AI output
    "azure-identity>=1.17",
    "openai>=1.35",                    # Azure OpenAI via AI Foundry
    "redis>=5.0",
    "azure-servicebus>=7.12",
    "azure-communication-email>=1.0",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",  # JWT validation for B2C tokens
    "python-multipart>=0.0.9",
    "stripe>=9.0.0",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",                     # TestClient transport
    "ruff>=0.4",
    "mypy>=1.10",
    "msal>=1.30",                       # used by scripts/smoke_test_auth.py
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "SIM102", "SIM105", "SIM116", "SIM117"]  # FastAPI Depends(), long strings in doc/eval prompts

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
