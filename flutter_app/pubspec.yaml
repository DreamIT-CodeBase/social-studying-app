name: social_study_app
description: Social Study App — AI-powered adaptive learning for families and schools.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7
  dio: ^5.4.3+1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.0.0+1
  # Sprint 5.8 — push notifications. ``firebase_core`` lets us boot
  # the SDK conditionally (we try-catch the init so a dev build
  # without ``google-services.json`` doesn't crash on startup), and
  # ``firebase_messaging`` is the FCM client itself.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_appauth: ^12.0.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^22.0.0
  shared_preferences: ^2.3.2
  audioplayers: ^6.0.0
  flutter_animate: ^4.5.0
  confetti: ^0.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_logo.jpg
    - assets/audio/
    - assets/mascot/
    - assets/icons/
